<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>R翻訳</title></head>
<body><main id="popup-root" tabindex="-1">
<section id="main-page"><header><img src="icon-128.png" width="44" height="44" alt=""><div><h1>R翻訳</h1><p>RTranslate</p></div><button id="open-settings" class="gear" aria-label="設定" title="設定">⚙</button></header>
<div id="site" class="site">現在のタブ</div><p id="status-line" role="status"><span id="status-dot" aria-hidden="true"></span><span id="status">準備状態を確認しています…</span></p>
<button id="translate" class="primary"><span id="translate-label">翻訳開始</span><span id="translate-symbol" class="play" aria-hidden="true"></span></button>
<div class="toggle-row"><span id="voice-label">日本語読み上げ</span><button id="voice" class="switch" role="switch" aria-checked="false" aria-labelledby="voice-label" disabled><span></span></button></div>
<div class="toggle-row"><span id="timeline-label">翻訳タイムライン</span><button id="timeline" class="switch" role="switch" aria-checked="false" aria-labelledby="timeline-label"><span></span></button></div>
<details><summary>詳細設定<span class="chevron" aria-hidden="true"></span></summary><div class="settings">
<label class="field choice-field"><span>翻訳方式</span><select id="backend"><option value="PLaMo">PLaMo（ローカル）</option><option value="Apple">Apple Translation</option></select></label>
<button id="prepare-apple" class="settings-link" hidden>Apple翻訳を準備</button>
<label class="field choice-field"><span>音声合成</span><select id="speech-engine"><option value="VOICEVOX">VOICEVOX</option><option value="Apple">macOS標準</option></select></label>
<label id="voice-row" class="field voice-field"><span>声</span><select id="speaker"></select><button id="preview" class="preview" aria-label="選んだ声を試聴" title="選んだ声を試聴"><span class="play" aria-hidden="true"></span></button></label>
<p id="preview-status" class="note" role="status"></p>
<label class="field"><span>音量</span><input id="volume" type="range" min="0" max="100" value="60"><span class="number"><input id="volume-number" type="number" min="0" max="100" value="60" aria-label="音量の数値">%</span></label>
<label class="field"><span>基本速度</span><input id="speed" type="range" min="0" max="5" step="1" value="2"><output id="speed-value" for="speed">1.25×</output></label>
<div class="auto"><label><input id="autoSpeed" type="checkbox" checked><span>遅れに応じて自動加速</span></label></div>
<div class="auto"><label><input id="smooth" type="checkbox" checked><span>フィラー・相づち・重複を減らす</span></label></div>
</div></details></section>
<section id="settings-page" hidden><header><button id="close-settings" class="back" aria-label="戻る">‹</button><h1>設定</h1></header>
<p class="note">整える・管理する設定はアプリで開きます。</p>
<button id="settings-overview" class="settings-link">概要・アップデート</button><button id="settings-dictionary" class="settings-link">辞書を編集</button><button id="settings-slides" class="settings-link">スライドの範囲を設定</button><button id="settings-models" class="settings-link">モデルを管理</button><button id="settings-history" class="settings-link">履歴を書き出す</button><button id="settings-support" class="settings-link">サポート・ライセンス・削除</button><p id="settings-status" class="note" role="status"></p>
</section></main><script type="module" src="popup.js"></script></body></html>
